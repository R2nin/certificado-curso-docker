# Servidor da página + proxy reverso para a API.
# "backend" é resolvido pelo DNS interno da rede do Compose:
# o navegador nunca fala direto com a API (sem CORS, uma porta só).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # transações levam alguns segundos
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
